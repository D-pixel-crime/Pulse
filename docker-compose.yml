services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # App listens on 0.0.0.0:8080 inside the container; host port is published only on 127.0.0.1
      APP_ADDR: 0.0.0.0:8080
      # Required secrets read from the user's .env file
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      PULSE_API_KEY: ${PULSE_API_KEY:?PULSE_API_KEY must be set in .env}
      # Tunable application configuration with safe defaults
      DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
      WORKER_COUNT: ${WORKER_COUNT:-5}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-1s}
    ports:
      # Bind exclusively to localhost for local demonstration
      - "127.0.0.1:8080:8080"
